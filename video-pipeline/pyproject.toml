[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avp"
version = "0.1.0"
description = "AI Video Pipeline: brief -> storyboard -> visuals -> voice-over -> finished MP4"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.20"]
dev = ["pytest>=8"]

[project.scripts]
avp = "avp.cli:main"

[tool.setuptools.packages.find]
include = ["avp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
