[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avp"
version = "0.1.0"
description = "AI video pipeline for faceless, bilingual explainer series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.1",
  "playwright>=1.40",
  "httpx>=0.25",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.20"]
anthropic = ["anthropic>=1.0"]
cosyvoice = ["dashscope>=1.20"]
dev = ["pytest>=8"]

[project.scripts]
avp = "avp.cli:main"

[tool.setuptools.packages.find]
include = ["avp*"]

[tool.setuptools.package-data]
avp = ["templates/*.toml", "diagrams/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
